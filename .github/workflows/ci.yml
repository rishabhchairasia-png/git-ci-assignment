name: HTML Validation CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  html-validation:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
